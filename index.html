<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDITH | Tactical Executive Console</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; flex-direction: column; height: 100vh; justify-content: space-between; }
        header { background-color: #1e293b; padding: 1rem 1.5rem; border-bottom: 1px solid #334155; display: flex; align-items: center; justify-content: space-between; }
        .title-container { display: flex; align-items: center; gap: 10px; }
        .status-dot { width: 10px; height: 10px; background-color: #10b981; border-radius: 50%; box-shadow: 0 0 8px #10b981; }
        h1 { font-size: 1.1rem; letter-spacing: 1px; color: #38bdf8; font-weight: 700; }
        .subtitle { font-size: 0.75rem; color: #94a3b8; }
        #chat-container { flex: 1; overflow-y: auto; padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; }
        .message { max-width: 80%; padding: 0.8rem 1.2rem; border-radius: 12px; font-size: 0.95rem; line-height: 1.5; white-space: pre-wrap; }
        .user-message { align-self: flex-end; background-color: #0284c7; color: #ffffff; border-bottom-right-radius: 2px; }
        .edith-message { align-self: flex-start; background-color: #1e293b; color: #e2e8f0; border: 1px solid #334155; border-bottom-left-radius: 2px; }
        .input-container { background-color: #1e293b; padding: 1rem; border-top: 1px solid #334155; display: flex; gap: 10px; }
        input[type="text"] { flex: 1; background-color: #0f172a; border: 1px solid #334155; padding: 0.8rem 1rem; border-radius: 8px; color: #fff; font-size: 0.95rem; outline: none; }
        input[type="text"]:focus { border-color: #38bdf8; }
        button { background-color: #0284c7; border: none; color: white; padding: 0.8rem 1.5rem; border-radius: 8px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        button:hover { background-color: #0369a1; }
        button:disabled { background-color: #334155; cursor: not-allowed; }
    </style>
</head>
<body>
    <header>
        <div class="title-container">
            <div class="status-dot"></div>
            <div>
                <h1>E.D.I.T.H.</h1>
                <div class="subtitle">Tactical Executive Interface</div>
            </div>
        </div>
    </header>

    <div id="chat-container">
        <div class="message edith-message">Sistemas en línea, Comandante. Motor Hermes/OpenClaw activo. ¿En qué le puedo asistir?</div>
    </div>

    <div class="input-container">
        <input type="text" id="user-input" placeholder="Escriba una directriz..." onkeypress="handleKeyPress(event)" />
        <button id="send-btn" onclick="sendMessage()">Enviar</button>
    </div>

    <script>
        async function sendMessage() {
            const input = document.getElementById('user-input');
            const button = document.getElementById('send-btn');
            const chatContainer = document.getElementById('chat-container');
            const text = input.value.trim();

            if (!text) return;

            // Agregar mensaje del usuario a la pantalla
            const userDiv = document.createElement('div');
            userDiv.className = 'message user-message';
            userDiv.textContent = text;
            chatContainer.appendChild(userDiv);

            input.value = '';
            input.disabled = true;
            button.disabled = true;
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                // Enviar la consulta al backend de EDITH
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });

                const data = await response.json();
                
                // Mostrar respuesta de EDITH
                const edithDiv = document.createElement('div');
                edithDiv.className = 'message edith-message';
                edithDiv.textContent = data.reply || data.detail || 'Sin respuesta del motor.';
                chatContainer.appendChild(edithDiv);

            } catch (error) {
                const errorDiv = document.createElement('div');
                errorDiv.className = 'message edith-message';
                errorDiv.style.color = '#f87171';
                errorDiv.textContent = 'Error de conexión con el servidor.';
                chatContainer.appendChild(errorDiv);
            }

            input.disabled = false;
            button.disabled = false;
            input.focus();
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }
    </script>
</body>
</html>
